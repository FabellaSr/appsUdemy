version: "3.9"
services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
    environment:
      - VITE_API_URL=http://localhost:4000/api
  backend:
    build: ./backend
    ports: ["4000:4000"]
    depends_on: [mongo, mssql]
    environment:
      - PORT=4000
      - JWT_SECRET=change-me-please
      - MONGO_URI=mongodb://mongo:27017/as400auth
      - MSSQL_HOST=mssql
      - MSSQL_PORT=1433
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=Your_strong_Pass1
      - MSSQL_DB=as400tasks
      - AS400_BASE_URL=http://AS400_HOST:PORT/quomrest
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_strong_Pass1
    ports: ["1433:1433"]
    volumes: [mssql_data:/var/opt/mssql]
volumes:
  mongo_data:
  mssql_data:
